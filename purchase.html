<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make a Purchase</title>
<link rel="stylesheet" href="style.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
<header><h1>Make a Purchase</h1><a href="index.html">Home</a></header>

<form id="purchaseForm" method="post">
<div id="success-message" class="hidden"></div>
<div id="error-message" class="hidden"></div>
<fieldset>
<legend>Your Account</legend>
<label for="CustomerID">Customer ID</label>
<input type="number" id="CustomerID" name="CustomerID" min="1" required>
<p class="note">No account? <a href="customer_signup.html">Sign up</a></p>
</fieldset>

<fieldset>
<legend>Items</legend>
<table>
<tr><th>Item No.</th><th>Quantity</th></tr>
<tr>
<td><input type="number" name="Item_No[]" min="1" required></td>
<td><input type="number" name="Sale_Quantity[]" min="1" value="1" required></td>
</tr>
<tr>
<td><input type="number" name="Item_No[]" min="1"></td>
<td><input type="number" name="Sale_Quantity[]" min="1"></td>
</tr>
<tr>
<td><input type="number" name="Item_No[]" min="1"></td>
<td><input type="number" name="Sale_Quantity[]" min="1"></td>
</tr>
</table>
<p class="note">On submit, a Sale row is created with today's date, the total Cost is calculated (applying Clothing_Line.On_Sale discounts), and Current_Stock is reduced.</p>
</fieldset>
<button type="submit">Place Order</button>
<button type="reset">Clear</button>
</form>
<script type="text/javascript">
    $('document').ready(function() {
        $('#purchaseForm').submit(function(e) {
            e.preventDefault();
            var FormData = $('#purchaseForm').serialize();
            $.ajax({
                type: 'post',
                url: './api/purchase.php',
                data: FormData,
                dataType: 'json',
                encode: true,
                success: function(res) {
                    console.log(res);
                    if (res.message == "ok"){
                        $('#success-message').removeClass("hidden");
                        $('#success-message').html("Purchase processed successfully.");
                        $(this)[0].reset(); // clear data from form after successful submit
                    } else{
                        $('#error-message').removeClass("hidden");
                        $('#error-message').html(res.message);
                    }
                }
            })
        })
    })
</script>
</body>
</html>
