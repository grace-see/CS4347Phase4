<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Signup</title>
<link rel="stylesheet" href="style.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
<header><h1>Customer Signup</h1><a href="index.html">Home</a></header>

<form id="signupForm" action="customer_signup" method="post">
<div id="success-message" class="hidden"></div>
<div id="error-message" class="hidden"></div>
<label for="F_Name">First Name</label>
<input type="text" id="F_Name" name="F_Name" maxlength="20" required>
<label for="L_Name">Last Name</label>
<input type="text" id="L_Name" name="L_Name" maxlength="20">
<label for="Phone_No">Phone Number (10 digits)</label>
<input type="tel" id="Phone_No" name="Phone_No" pattern="[0-9]{10}" maxlength="10" placeholder="9725551234">
<label for="DOB">Date of Birth</label>
<input type="date" id="DOB" name="DOB">
<label for="Email">Email</label>
<input type="email" id="Email" name="Email" maxlength="64">
<p class="note">CustomerID is assigned automatically by the database.</p>
<button type="submit">Sign Up</button>
<button type="reset">Clear</button>
</form>
<script type="text/javascript">
    $('document').ready(function() {
        $('#signupForm').submit(function(e) {
            e.preventDefault();
            var FormData = $('#signupForm').serialize();
            $.ajax({
                type: 'post',
                url: './api/customer_signup.php',
                data: FormData,
                dataType: 'json',
                encode: true,
                success: function(res) {
                    console.log(res);
                    if (res.message == "ok"){
                        $('#success-message').removeClass("hidden");
                        $('#success-message').html("Signup successful.");
                    } else{
                        $('#error-message').removeClass("hidden");
                        $('#error-message').html(res.message);
                    }
                }
            })
            $(this)[0].reset(); // clear data from form after submit
        })
    })
</script>
</body>
</html>
