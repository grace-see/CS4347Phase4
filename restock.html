<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receive Shipment</title>
<link rel="stylesheet" href="style.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
<header><h1>Receive Shipment</h1><a href="index.html">Home</a></header>

<form id="restockForm" action="restock" method="post">
<div id="success-message" class="hidden"></div>
<div id="error-message" class="hidden"></div>
<label for="Item_No">Item No.</label>
<input type="number" id="Item_No" name="Item_No" min="1" required>
<label for="Quantity">Quantity Received</label>
<input type="number" id="Quantity" name="Quantity" min="1" required>
<p class="note">Adds Quantity to Clothing_Item.Current_Stock.</p>
<button type="submit">Add Stock</button>
<button type="reset">Clear</button>
</form>
<script type="text/javascript">
    $('document').ready(function() {
        $('#restockForm').submit(function(e) {
            e.preventDefault();
            var FormData = $('#restockForm').serialize();
            $.ajax({
                type: 'post',
                url: './api/restock.php',
                data: FormData,
                dataType: 'json',
                encode: true,
                success: function(res) {
                    console.log(res);
                    if (res.message == "ok"){
                        $('#success-message').removeClass("hidden");
                        $('#success-message').html("Item quantity updated.");
                    } else{
                        $('#error-message').removeClass("hidden");
                        $('#error-message').html(res.message);
                    }
                }
            })
            $(this)[0].reset(); // clear data from form after submit
        })
    })
</script>
</body>
</html>
