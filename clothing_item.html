<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Clothing Items</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Manage Clothing Items</h1><a href="index.html">Home</a></header>

<form action="./api/clothing_item_add.php" method="post">
<h2>Add a Clothing Item</h2>
<label for="Item_No">Item No.</label>
<input type="number" id="Item_No" name="Item_No" min="1" required>
<label for="CL_Name">Clothing Line</label>
<input type="text" id="CL_Name" name="CL_Name" maxlength="30" required>
<label>Gender</label>
<input type="radio" id="g_m" name="Gender" value="M"> <label for="g_m" style="display:inline">Male</label>
<input type="radio" id="g_f" name="Gender" value="F"> <label for="g_f" style="display:inline">Female</label>
<input type="radio" id="g_u" name="Gender" value="U" checked> <label for="g_u" style="display:inline">Unisex</label>
<label for="Size">Size</label>
<select id="Size" name="Size" required>
<option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option>
</select>
<label for="Material">Material</label>
<input type="text" id="Material" name="Material" maxlength="15" required>
<label for="Price">Price ($)</label>
<input type="number" id="Price" name="Price" min="0" step="0.01" required>
<label for="Current_Stock">Starting Stock</label>
<input type="number" id="Current_Stock" name="Current_Stock" min="0" required>
<button type="submit">Add Item</button>
<button type="reset">Clear</button>
</form>
<br>
<form action="./api/clothing_item_delete.php" method="post">
<h2>Delete a Clothing Item</h2>
<label for="del_Item_No">Item No.</label>
<input type="number" id="del_Item_No" name="Item_No" min="1" required>
<p class="note">Deleting an item cascades to its Sales_Line and C_Line_Contains rows.</p>
<button type="submit">Delete Item</button>
</form>
</body>
</html>
