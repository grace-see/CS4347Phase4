<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enter a Sale</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Enter a Sale</h1><a href="index.html">Home</a></header>

<form action="./api/sale_entry.php" method="post">
<fieldset>
<legend>Sale</legend>
<label for="TransactionID">Transaction ID</label>
<input type="number" id="TransactionID" name="TransactionID" min="1" required>
<label for="CustomerID">Customer ID (leave blank for guest)</label>
<input type="number" id="CustomerID" name="CustomerID" min="1">
<label for="Date">Date</label>
<input type="date" id="Date" name="Date" required>
<label for="Cost">Total Cost ($, incl. tax)</label>
<input type="number" id="Cost" name="Cost" min="0" step="0.01" value="0" required>
</fieldset>

<fieldset>
<legend>Sales Lines (items sold)</legend>
<table>
<tr><th>Item No.</th><th>Quantity</th></tr>
<tr><td><input type="number" name="Item_No[]" min="1" required></td><td><input type="number" name="Sale_Quantity[]" min="1" required></td></tr>
<tr><td><input type="number" name="Item_No[]" min="1"></td><td><input type="number" name="Sale_Quantity[]" min="1"></td></tr>
<tr><td><input type="number" name="Item_No[]" min="1"></td><td><input type="number" name="Sale_Quantity[]" min="1"></td></tr>
<tr><td><input type="number" name="Item_No[]" min="1"></td><td><input type="number" name="Sale_Quantity[]" min="1"></td></tr>
</table>
<p class="note">Each line inserts into Sales_Line and deducts Sale_Quantity from Clothing_Item.Current_Stock.</p>
</fieldset>

<button type="submit">Record Sale</button>
<button type="reset">Clear</button>
</form>
</body>
</html>
